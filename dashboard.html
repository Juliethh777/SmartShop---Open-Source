<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - SmartShop</title>

<style>

    body {
        margin: 0;
        font-family: Georgia, 'Times New Roman', Times, serif;
        background: #0f172a;
        color: white;
        display: flex;
    }

    .sidebar {
        width: 220px;
        height: 100vh;
        background: #111827;
        padding: 20px;
    }

    .sidebar h2 {
        color: #facc15;
        text-align: center;
    }

    .sidebar a {
        display: block;
        color: white;
        text-decoration: none;
        padding: 10px;
        margin: 8px 0;
    }

    .main {
        flex: 1;
        padding: 20px;
    }

    .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
        gap: 20px;
    }

    .card {
        background: #1e293b;
        padding: 20px;
        border-radius: 10px;
    }

</style>

</head>

<body>

<div class="sidebar">
    <h2>SmartShop</h2>

    <a href="dashboard.html"> •Dashboard</a>
    <a href="productos.html"> •Productos</a>
    <a href="usuarios.html"> •Usuarios</a>
    <a href="reportes.html"> •Reportes</a>
</div>

<div class="main dashboard-container">

    <h1>Panel de Control</h1>

    <button onclick="cerrarSesion()">
        Cerrar Sesión
    </button>

    <div class="card">

        <h2 id="bienvenida"></h2>

        <p>
            Desde este panel puede gestionar usuarios,
            productos, inventario y reportes.
        </p>

    </div>

    <br>

    <div class="cards">

        <div class="card">
            <h3>Usuarios</h3>
            <p id="totalUsuarios">0</p>
        </div>

        <div class="card">
            <h3>Productos</h3>
            <p id="totalProductos">0</p>
        </div>

        <div class="card">
            <h3>Ventas</h3>
            <p>Próximamente</p>
        </div>

    </div>

</div>

    <br>

    <div class="cards">

        <div class="card">
            <h3> Usuarios</h3>
            <p id="totalUsuarios">0</p>
        </div>

        <div class="card">
            <h3> Productos</h3>
            <p id="totalProductos">0</p>
        </div>

        <div class="card">
            <h3> Ventas</h3>
            <p>Próximamente</p>
        </div>

    </div>

</div>

<script>

let usuarioActivo = JSON.parse(
    localStorage.getItem("usuarioActivo")
);

if(!usuarioActivo){

    window.location.href = "index.html";

}

document.getElementById("bienvenida").innerText =
"Bienvenido " + usuarioActivo.nombre;

let usuarios =
JSON.parse(localStorage.getItem("usuarios")) || [];

document.getElementById("totalUsuarios").innerText =
usuarios.length;

let productos =
JSON.parse(localStorage.getItem("productos")) || [];

document.getElementById("totalProductos").innerText =
productos.length;

function cerrarSesion(){

    localStorage.removeItem("usuarioActivo");

    window.location.href = "index.html";

}

</script>

</body>
</html>
