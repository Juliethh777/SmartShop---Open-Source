<!DOCTYPE html>

<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartShop - Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

<div class="container">

    <img src="img/logo.jpg" alt="Logo SmartShop" class="logo">

    <h1>SMARTSHOP</h1>

    <h3>Gestión Inteligente de Ventas e Inventario</h3>

    <form id="loginForm">

        <input
           type="text"
           id="username"
           placeholder="Ingrese Usuario"
           required>

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Ingrese Contraseña"
            required>

        <br><br>

        <button type="submit">
            Iniciar Sesión
        </button>

    </form>

    <br>

    <p>¿No tienes cuenta?</p>

    <a href="registro.html">
        Registrarse
    </a>

</div>

<script src="login.js"></script>


</body>

</html>
