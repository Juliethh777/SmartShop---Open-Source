<div class="container">

    <img src="img/logo.jpg" alt="Logo SmartShop" class="logo">

    <h1>SMARTSHOP</h1>

    <h3>Gestión Inteligente de Ventas e Inventario</h3>

    <form id="loginForm">

        <input
            type="email"
            id="username"
            placeholder="Ingrese Correo"
            required>

        <br><br>

        <input
            type="password"
            id="password"
            placeholder="Ingrese Contraseña"
            required>

        <br><br>

        <button type="submit">
            Iniciar Sesión
        </button>

    </form>

    <br>

    <p>¿No tienes cuenta?</p>

    <a href="registro.html">
        Registrarse
    </a>

</div>
