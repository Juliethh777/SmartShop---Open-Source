<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Productos - SmartShop</title>

```
<style>

    body{
        margin:0;
        padding:30px;
        font-family:Arial, sans-serif;

    h1{

```

</head>
<body>

<h1>📦 Gestión de Productos</h1>

<a href="dashboard.html">
    Volver al Dashboard
</a>

<br><br>

<form id="formProducto">

```
<input
    type="text"
    id="nombre"
    placeholder="Nombre Producto"
    required>

<input
    type="number"
    id="precio"
    placeholder="Precio"
    required>

<input
    type="number"
    id="stock"
    placeholder="Stock"
    required>

<button type="submit">
    Agregar Producto
</button>
```

</form>

<table>

```
<thead>
    <tr>
        <th>ID</th>
        <th>Producto</th>
        <th>Precio</th>
        <th>Stock</th>
    </tr>
</thead>

<tbody id="tablaProductos">

</tbody>
```

</table>

<script>

let productos =
JSON.parse(localStorage.getItem("productos")) || [];

mostrarProductos();

document.getElementById("formProducto")
.addEventListener("submit", function(e){

    e.preventDefault();

    let nombre =
    document.getElementById("nombre").value;

    let precio =
    document.getElementById("precio").value;

    let stock =
    document.getElementById("stock").value;

    let nuevoProducto = {

        id: Date.now(),
        nombre: nombre,
        precio: precio,
        stock: stock

    };

    productos.push(nuevoProducto);

    localStorage.setItem(
        "productos",
        JSON.stringify(productos)
    );

    this.reset();

    mostrarProductos();

});

function mostrarProductos(){

    let tabla =
    document.getElementById("tablaProductos");

    tabla.innerHTML = "";

    productos.forEach(producto => {

        tabla.innerHTML += `

        <tr>
            <td>${producto.id}</td>
            <td>${producto.nombre}</td>
            <td>$${producto.precio}</td>
            <td>${producto.stock}</td>
        </tr>

        `;

    });

}

</script>

</body>
</html>
