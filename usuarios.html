<!DOCTYPE html>

        }

        button {

            border: none;

            margin-right: 10px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
        }

        }

            text-align: center;
